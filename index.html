const fresh = () => ({name:"",stage:"welcome",lessonIndex:0,lessonDone:[],practiceIndex:0,bossIndex:0,xp:0,hearts:5,streak:0,snacks:0,correct:0,wrong:0,missed:[],startedAt:null,elapsed:0,training:false,questionErrors:{},reviewInserted:0,paceKey:"",paceStartedAt:null,paceSeconds:0,paceReleased:false});
let state = loadState();
let transient = {selected:null,feedback:null,current:null,currentIsReview:false,selectedLeft:null,assignments:{},reviewTag:null,reviewTries:0,reviewList:[],toastTimer:null};

function loadState(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");return x&&x.name?{...fresh(),...x,stage:x.stage||"welcome"}:fresh()}catch{return fresh()}}
function persist(){try{const copy={...state};localStorage.setItem(KEY,JSON.stringify(copy))}catch{}}
function esc(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function getElapsed(){return state.startedAt?Math.floor((Date.now()-state.startedAt)/1000):state.elapsed||0}
function paceRemaining(key,seconds){if(state.paceKey!==key){state.paceKey=key;state.paceStartedAt=Date.now();state.paceSeconds=seconds;state.paceReleased=false;persist()}return Math.max(0,state.paceSeconds-Math.floor((Date.now()-state.paceStartedAt)/1000))}
function paceNote(left,label){return '<div class="pace-note"><span>'+label+'</span></div>'}
function topicName(tag){return ({overview:"Visão do sistema",inheritance:"Herança e abstração",validation:"Validação de placa",composition:"Composição e vagas",tickets:"Tickets",billing:"Cobrança",polymorphism:"Polimorfismo",protocol:"Protocol Localizavel",menu:"Menu e exceções",persistence:"Persistência"})[tag]||tag}
function totalProgress(){const done=(state.lessonDone||[]).filter(Boolean).length;return Math.min(100,Math.round((done+state.practiceIndex+state.bossIndex)/44*100))}
function stageCounts(){return {lessons:(state.lessonDone||[]).filter(Boolean).length,practice:state.practiceIndex,boss:state.bossIndex}}
function heartsHTML(){let h="";for(let i=0;i<5;i++)h+=`<span class="${i<state.hearts?"":"empty-heart"}" aria-hidden="true">${i<state.hearts?"♥":"♡"}</span>`;return h}
function stageWord(){return state.stage==="lesson"?"APRENDER":state.stage==="practice"?"PRATICAR":state.stage==="boss"?"BOSS":state.stage==="review"?"REFORÇO":"CONCLUÍDO"}

function renderLesson(){
 const i=Math.min(state.lessonIndex,LESSONS.length-1),l=LESSONS[i],done=!!state.lessonDone[i],pace=paceRemaining("lesson:"+i,60),unlocked=!!transient.lessonUnlocked;
 const opts=l.options.map((o,j)=>'<button class="choice '+(transient.selected===j?"selected":"")+' '+(transient.feedback?((transient.feedback.ok||transient.feedback.secondError)&&j===l.answer?"correct":transient.selected===j?"wrong":""):"")+'" data-action="lesson-choice" data-index="'+j+'" '+(transient.feedback?"disabled":"")+'>'+esc(o)+'</button>').join("");
 const feedback=transient.feedback?'<div class="answer-note '+(transient.feedback.ok?"good":"bad")+'"><strong>'+(transient.feedback.ok?"Memória afiada!":"Pista recebida.")+'</strong>'+esc(transient.feedback.text)+'</div>':"";
 const nextText=i===7?"IR PARA A PRÁTICA →":"PRÓXIMA AULA →";
 const checkpoint=unlocked?'<section class="checkpoint question-appear"><div class="eyebrow">CHECKPOINT DE MEMÓRIA • '+(i+1)+'/8</div><div class="question-visual-row">'+questionIllustration(l.tag,"lesson-"+i,l.q)+'<h3>'+esc(l.q)+'</h3></div><p>Escolha a resposta e confira a explicação.</p>'+paceNote(pace,"Leia tudo; quando estiver pronto, responda sem esperar um cronômetro.")+'<div class="choices">'+opts+'</div>'+feedback+'<div class="actions"><span class="mini-progress">'+(done?"Aula marcada como concluída.":"O progresso avança quando você acerta o checkpoint.")+'</span><div class="actions-right"><button class="secondary" data-action="prev-lesson" '+(i===0?"disabled":"")+'>← Voltar</button>'+(transient.feedback?'<button class="primary" data-action="next-lesson" '+("")+'>'+nextText+'</button>':'<button class="primary" data-action="submit-lesson" '+(transient.selected===null||"")+'>'+ 'CONFERIR</button>')+'</div></div></section>':'<section class="read-gate"><div class="eyebrow">PRIMEIRO, ENTENDA</div><h3>Leia a explicação e o trecho de código.</h3><p>O checkpoint fica escondido até você terminar esta leitura. Quando estiver pronto, abra a pergunta.</p><button class="primary" id="readDoneButton" data-action="unlock-lesson" disabled>REVELAR PERGUNTA</button></section>';
 renderFrame('<div class="section-heading reveal-in"><div><div class="eyebrow">AULA '+String(i+1).padStart(2,"0")+' DE 08 • '+esc(l.minutes)+' DE LEITURA</div><h1>'+esc(l.title)+'</h1><p>Entenda a ideia e diga com suas palavras antes do checkpoint.</p></div><span class="level-chip">'+esc(topicName(l.tag))+'</span></div><div class="lesson-layout"><div class="lesson-visual">'+lessonArt(l.tag)+'</div><div class="lesson-copy"><p>'+esc(l.body)+'</p><ul>'+l.bullets.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul><div class="key-idea"><strong>GUARDE ESTA IDEIA</strong><span>'+esc(l.remember)+'</span></div><pre class="code-block">'+esc(l.code)+'</pre></div></div>'+checkpoint);
 if(!unlocked)setTimeout(()=>{const b=document.getElementById("readDoneButton");if(b)b.disabled=false},1750)
}
function exerciseFill(ex,kind){const opts=ex.options.map((o,j)=>`<button class="choice ${transient.selected===j?"selected":""} ${transient.feedback?((transient.feedback.ok||transient.feedback.secondError)&&j===ex.answer?"correct":transient.selected===j?"wrong":""):""}" data-action="exercise-choice" data-index="${j}" ${transient.feedback?"disabled":""}>${esc(o)}</button>`).join("");const head=kind==="boss"?`<div class="boss-mark"><i class="boss-pixel"></i> PERGUNTA ${state.bossIndex+1} / 20</div>`:`<div class="question-tag">${transient.currentIsReview?"REVISÃO ESPAÇADA":"DESAFIO DE CÓDIGO"} • ${state.practiceIndex+1} / 16</div>`;return `<div class="exercise-box">${head}<div class="question-visual-row">${questionIllustration(ex.tag,"practice-"+state.practiceIndex,ex.prompt||ex.q)}<p class="exercise-prompt">${esc(ex.prompt||ex.q)}</p></div>${ex.code?`<pre class="code-exercise">${esc(ex.code).replace("____",`<span class="blank">${transient.selected===null?"____":esc(ex.options[transient.selected])}</span>`)}</pre>`:""}<div class="choices">${opts}</div>${ex.hint?`<p class="exercise-hint">${esc(ex.hint)}</p>`:""}</div>`}
function exerciseMatch(ex){if(!transient.current){transient.current=structuredClone(ex);transient.assignments={};}if(!Array.isArray(transient.current.rightOrder))transient.current.rightOrder=shuffle(ex.pairs.map((p,i)=>i));const curr=transient.current,connected=transient.assignments;const left=curr.pairs.map((p,i)=>`<button class="match-tile ${transient.selectedLeft===i?"selected":""} ${connected[i]!==undefined?"paired":""}" data-action="match-left" data-index="${i}">${esc(p[0])}</button>`).join("");const right=curr.rightOrder.map((id,j)=>{const owners=Object.keys(connected).find(k=>connected[k]===id);return `<button class="match-tile ${owners!==undefined?"paired":""}" data-action="match-right" data-index="${id}">${esc(curr.pairs[id][1])}</button>`}).join("");const done=Object.keys(connected).length===curr.pairs.length;return `<div class="exercise-box"><div class="question-tag">${transient.currentIsReview?"REVISÃO ESPAÇADA":"LIGUE OS PARES"} • ${state.practiceIndex+1} / 16</div><div class="question-visual-row">${questionIllustration(ex.tag,"practice-"+state.practiceIndex,ex.prompt||ex.q)}<p class="exercise-prompt">${esc(ex.prompt||ex.q)}</p></div><p class="exercise-hint">Toque em um quadro da esquerda e depois na resposta correspondente à direita.</p><div class="match-grid"><div class="match-column">${left}</div><div class="match-column">${right}</div></div>${done?`<div class="answer-note">Pares ligados: ${Object.entries(connected).map(([l,r])=>`${esc(curr.pairs[l][0])} ↔ ${esc(curr.pairs[r][1])}`).join(" • ")}</div>`:""}</div>`}
function renderExercise(ex,kind="practice"){if(!ex)return "";const paceKey=kind==="boss"?"boss:"+state.bossIndex:"practice:"+state.practiceIndex+":"+(transient.currentIsReview?(transient.current.tag||"review"):"main"),pace=paceRemaining(paceKey,20);let html;if(ex.type==="match")html=exerciseMatch(ex);else html=exerciseFill(ex,kind);let note=transient.feedback?`<div class="answer-note ${transient.feedback.ok?"good":"bad"}"><strong>${transient.feedback.ok?"Correto. Petisco conquistado.":"Quase. Repare na regra."}</strong>${esc(transient.feedback.text)}${transient.feedback.say?`<div class="verbal-card"><b>Fale com suas palavras:</b> ${esc(transient.feedback.say)}</div>`:""}</div>`:"";const canSubmit=ex.type==="match"?Object.keys(transient.assignments).length===ex.pairs.length:transient.selected!==null;const button=transient.feedback?`<button class="primary" data-action="next-question" ${""}>${kind==="boss"?(state.bossIndex>=19?(state.missed.length?"IR PARA A REVISÃO →":"VER RESULTADO →"):"PRÓXIMA PERGUNTA →"):"CONTINUAR →"}</button>`:`<button class="primary" data-action="submit-exercise" ${canSubmit?"":"disabled"}>${ex.type==="match"?"VERIFICAR PARES":"CONFERIR RESPOSTA"}</button>`;return `${html}${paceNote(pace,"Leia a questão e responda quando quiser; não há espera obrigatória.")}${note}<div class="actions"><span class="mini-progress">${kind==="boss"?"Responda e depois explique em voz alta.":"Erros importantes voltam em outra pergunta."}</span><div class="actions-right">${button}</div></div>`}
function newPractice(){if(transient.current)return transient.current;const due=(state.practiceIndex>0&&state.practiceIndex%4===0&&state.reviewInserted<6)?state.missed.find(x=>!x.reviewedInPractice):null;if(due&&REVIEW_BANK[due.tag]){transient.current={...REVIEW_BANK[due.tag],tag:due.tag,answer:REVIEW_BANK[due.tag].a,prompt:REVIEW_BANK[due.tag].q};transient.currentIsReview=true;due.reviewedInPractice=true;state.reviewInserted=(state.reviewInserted||0)+1;}else{transient.current=PRACTICE[state.practiceIndex];transient.currentIsReview=false;}transient.selected=null;transient.feedback=null;transient.assignments={};transient.selectedLeft=null;return transient.current}
function renderPractice(){if(state.practiceIndex>=PRACTICE.length){state.stage="boss";state.bossIndex=0;transient.current=null;persist();return renderBoss()}const ex=newPractice();renderFrame(`<div class="section-heading"><div><div class="eyebrow">PRÁTICA • 16 DESAFIOS + REVISÕES ADAPTATIVAS</div><h1>Hora de usar o código.</h1><p>Complete trechos, escolha regras corretas e conecte as responsabilidades. Os mesmos conceitos reaparecem espaçados.</p></div><span class="level-chip">${transient.currentIsReview?"RETORNO DE MEMÓRIA":`DESAFIO ${state.practiceIndex+1} / 16`}</span></div>${renderExercise(ex,"practice")}`)}
function renderBoss(){if(state.bossIndex>=BOSS.length){state.stage=state.missed.length?"review":"finish";transient.current=null;persist();return state.stage==="review"?renderReview():renderFinish()}const q=BOSS[state.bossIndex];const ex={type:"mc",q:q.q,options:q.options,answer:q.a,tag:q.tag,why:q.why,say:q.say};transient.current=ex;const pace=paceRemaining("boss:"+state.bossIndex,20),feedback=transient.feedback;const opts=q.options.map((o,j)=>`<button class="choice ${transient.selected===j?"selected":""} ${feedback?((feedback.ok||feedback.secondError)&&j===q.a?"correct":transient.selected===j?"wrong":""):""}" data-action="exercise-choice" data-index="${j}" ${feedback?"disabled":""}>${esc(o)}</button>`).join("");const note=feedback?`<div class="answer-note ${feedback.ok?"good":"bad"}"><strong>${feedback.ok?"Resposta afiada.":"O professor vai pedir o porquê."}</strong>${esc(q.why)}<div class="verbal-card"><b>Explique em voz alta:</b> ${esc(q.say)}</div></div>`:"";const next=feedback?`<button class="primary" data-action="next-boss" ${""}>${state.bossIndex>=19?(state.missed.length?"IR PARA O REFORÇO →":"ENCERRAR CAMPANHA →"):"PRÓXIMA PERGUNTA →"}</button>`:`<button class="primary" data-action="submit-boss" ${transient.selected===null||""}>RESPONDER</button>`;renderFrame(`<div class="section-heading"><div><div class="boss-mark"><i class="boss-pixel"></i> DESAFIO FINAL • PERGUNTA ${String(state.bossIndex+1).padStart(2,"0")} / 20</div><h1 style="margin-top:13px">O professor quer entender o seu raciocínio.</h1><p>Responda com conhecimento do projeto e depois tente explicar sem ler. Isso treina sua apresentação; não é um detector de uso de IA.</p></div><img class="boss-professor-img" src="poo-quest-assets/boss-professor.png" alt="Professor ilustrado do Boss"></div><div class="exercise-box"><div class="question-tag">${esc(topicName(q.tag))} • DEFENDA A DECISÃO</div><div class="question-visual-row">${questionIllustration(q.tag,"boss-"+state.bossIndex,q.q)}<p class="exercise-prompt">${esc(q.q)}</p></div>${paceNote(pace,"Responda quando estiver pronto; depois explique o raciocínio com suas palavras.")}<div class="choices">${opts}</div>${note}</div><div class="actions"><span class="mini-progress">${state.hearts===0?"Modo treino ativo: o Boss continua sem bloquear você.":`Vidas restantes: ${state.hearts}/5`}</span><div class="actions-right">${next}</div></div>`)}
function renderReview(){if(!state.missed.length){state.stage="finish";persist();return renderFinish()}const entry=state.missed[0],q=REVIEW_BANK[entry.tag]||REVIEW_BANK.overview;transient.reviewTag=entry.tag;const opts=q.options.map((o,j)=>`<button class="choice ${transient.selected===j?"selected":""} ${transient.feedback?((feedback.ok||feedback.secondError)&&j===q.a?"correct":transient.selected===j?"wrong":""):""}" data-action="exercise-choice" data-index="${j}" ${transient.feedback?"disabled":""}>${esc(o)}</button>`).join("");const note=transient.feedback?`<div class="answer-note ${transient.feedback.ok?"good":"bad"}"><strong>${transient.feedback.ok?"Conceito recuperado!":"Leia a pista e tente de novo."}</strong>${esc(q.why)}</div>`:"";const count=state.missed.length;renderFrame(`<div class="section-heading"><div><div class="eyebrow">REFORÇO ADAPTATIVO • ${count} ${count===1?"TÓPICO":"TÓPICOS"} A REVER</div><h1>Vamos fechar as lacunas.</h1><p>Estas perguntas foram escolhidas porque algum conceito importante pediu mais uma rodada.</p></div>${illustrationIcon("shield")}</div><div class="topic-list">${state.missed.map(m=>`<span class="topic-chip">${esc(topicName(m.tag))} • ${m.tries||1} tentativa(s)</span>`).join("")}</div><div class="exercise-box"><div class="question-tag">RETOMADA • ${esc(topicName(entry.tag))}</div><div class="question-visual-row">${questionIllustration(entry.tag,"review-"+entry.tag+"-"+entry.tries,q.q)}<p class="exercise-prompt">${esc(q.q)}</p></div>${q.code?`<pre class="code-exercise">${esc(q.code)}</pre>`:""}<div class="choices">${opts}</div>${note}</div><div class="actions"><span class="mini-progress">${state.training?"Acertar uma revisão recupera uma vida.":"Sem pressa: o reforço existe para ensinar, não punir."}</span><div class="actions-right">${transient.feedback?`<button class="secondary" data-action="defer-review">Rever depois</button><button class="primary" data-action="next-review">${transient.feedback.ok?"PRÓXIMO TÓPICO →":"TENTAR DE NOVO →"}</button>`:`<button class="primary" data-action="submit-review" ${transient.selected===null?"disabled":""}>CONFERIR</button>`}</div></div>`)}
function renderFinish(){const total=state.correct+state.wrong,acc=total?Math.round(state.correct/total*100):0;renderFrame(`<div class="eyebrow">CAMPANHA CONCLUÍDA • ${fmtTime(getElapsed())}</div><h1 style="font-size:clamp(2rem,4vw,3.4rem);letter-spacing:-.05em;margin:8px 0">Mandou bem, ${esc(state.name)}.</h1><p class="muted" style="line-height:1.65;max-width:720px">Você percorreu as aulas, praticou os conceitos e enfrentou as 20 perguntas do professor. A parte mais importante: agora explique as respostas com suas próprias palavras.</p><div class="summary-grid"><div class="summary-stat"><b>${state.xp}</b><span>XP conquistados</span></div><div class="summary-stat"><b>${state.snacks}</b><span>petiscos</span></div><div class="summary-stat"><b>${acc}%</b><span>precisão das tentativas</span></div><div class="summary-stat"><b>${fmtTime(getElapsed())}</b><span>tempo de estudo</span></div></div><div class="key-idea"><strong>SEU PRÓXIMO PASSO</strong><span>${state.missed.length?`Revisar: ${state.missed.map(x=>topicName(x.tag)).join(", ")}.`:`Conte o fluxo sem olhar: cadastro → entrada → ticket → cobrança → relatório.`}</span></div>${state.missed.length?`<div class="topic-list">${state.missed.map(x=>`<span class="topic-chip">${esc(topicName(x.tag))}</span>`).join("")}</div>`:""}<div class="actions"><span class="mini-progress">Vidas restantes: ${state.hearts}/5 ${state.training?"• modo treino concluído":""}</span><div class="actions-right">${state.missed.length?`<button class="secondary" data-action="restart-review">REFAZER REFORÇO</button>`:""}<button class="primary" data-action="restart-campaign">NOVA CAMPANHA</button></div></div>`)}
function render(){if(state.stage==="welcome")return renderWelcome();if(!state.startedAt)state.startedAt=Date.now();if(state.stage==="lesson")return renderLesson();if(state.stage==="practice")return renderPractice();if(state.stage==="boss")return renderBoss();if(state.stage==="review")return renderReview();if(state.stage==="finish")return renderFinish();state.stage="welcome";renderWelcome()}
function start(){const input=document.getElementById("studentName"),name=(input?.value||state.name||"").trim();if(name.length<2){input?.focus();return}state.name=name;state.startedAt=state.startedAt||Date.now();state.stage="lesson";if(!Array.isArray(state.lessonDone))state.lessonDone=[];persist();render()}
function nextLesson(){state.lessonIndex++;transient.selected=null;transient.feedback=null;transient.lessonUnlocked=false;if(state.lessonIndex>=LESSONS.length){state.lessonIndex=LESSONS.length-1;state.stage="practice";transient.current=null;state.practiceIndex=0;state.reviewInserted=0}persist();render()}
function submitLesson(){const l=LESSONS[state.lessonIndex];if(transient.selected===null)return;const id="lesson:"+state.lessonIndex,ok=transient.selected===l.answer,attempt=ok?0:recordWrong(id),secondError=!ok&&attempt%2===0,lifeLost=secondError&&state.hearts>0;if(ok)clearQuestionErrors(id);transient.feedback={ok:ok,text:l.why,hint:studyHint(l.tag),answer:l.options[l.answer],attempt:attempt,secondError:secondError,lifeLost:lifeLost};if(ok){if(!state.lessonDone[state.lessonIndex])addXP(10);state.lessonDone[state.lessonIndex]=true}else{state.wrong++;if(secondError)loseHeart();addMissed(l.tag)}persist();render()}
function practiceQuestion(){return transient.current||PRACTICE[state.practiceIndex]}
function submitPractice(){const ex=practiceQuestion();let ok=false;if(ex.type==="match"){ok=ex.pairs.every((p,i)=>transient.assignments[i]===i)}else ok=Number(transient.selected)===Number(ex.answer);const id=transient.currentIsReview?"practice-review:"+ex.tag:"practice:"+state.practiceIndex,attempt=ok?0:recordWrong(id),why=ex.why||"Revise a explicação da aula relacionada e tente de novo.",answer=ex.type==="match"?ex.pairs.map(p=>p[0]+" → "+p[1]).join(" • "):(ex.options||[])[ex.answer],secondError=!ok&&attempt%2===0,lifeLost=secondError&&state.hearts>0;if(ok)clearQuestionErrors(id);transient.feedback={ok:ok,text:why,hint:studyHint(ex.tag),answer:answer,attempt:attempt,secondError:secondError,lifeLost:lifeLost};if(ok){addXP(transient.currentIsReview?8:10);if(transient.currentIsReview)clearMissed(ex.tag)}else{state.wrong++;if(secondError)loseHeart();addMissed(ex.tag)}persist();render()}
function nextPractice(){if(transient.currentIsReview){transient.current=null;transient.currentIsReview=false}else{state.practiceIndex++;transient.current=null}transient.selected=null;transient.feedback=null;transient.assignments={};transient.selectedLeft=null;if(state.practiceIndex>=PRACTICE.length){state.stage="boss";state.bossIndex=0}persist();render()}
function submitBoss(){const q=BOSS[state.bossIndex],id="boss:"+state.bossIndex,ok=Number(transient.selected)===q.a,attempt=ok?0:recordWrong(id),secondError=!ok&&attempt%2===0,lifeLost=secondError&&state.hearts>0;if(ok)clearQuestionErrors(id);transient.feedback={ok:ok,text:q.why,hint:studyHint(q.tag),answer:q.options[q.a],say:q.say,attempt:attempt,secondError:secondError,lifeLost:lifeLost};if(ok)addXP(15);else{state.wrong++;if(secondError)loseHeart();addMissed(q.tag)}persist();render()}
function nextBoss(){state.bossIndex++;transient.selected=null;transient.feedback=null;if(state.bossIndex>=BOSS.length){state.stage=state.missed.length?"review":"finish";transient.reviewTag=null}persist();render()}
function submitReview(){const tag=transient.reviewTag||state.missed[0]?.tag,q=REVIEW_BANK[tag]||REVIEW_BANK.overview,id="review:"+tag,ok=Number(transient.selected)===q.a,attempt=ok?0:recordWrong(id),secondError=!ok&&attempt%2===0,lifeLost=secondError&&state.hearts>0;if(ok)clearQuestionErrors(id);transient.feedback={ok:ok,text:q.why,hint:studyHint(tag),answer:q.options[q.a],attempt:attempt,secondError:secondError,lifeLost:lifeLost};const entry=state.missed.find(x=>x.tag===tag);if(ok){clearMissed(tag);if(state.training&&state.hearts<5){state.hearts++;if(state.hearts>0)state.training=false}addXP(8)}else{state.wrong++;if(secondError)loseHeart();if(entry)entry.tries=(entry.tries||0)+1}persist();render()}
function nextReview(){transient.selected=null;transient.feedback=null;transient.reviewTag=null;if(!state.missed.length)state.stage="finish";persist();render()}
function makeNewCampaign(){state={...fresh(),name:"",stage:"welcome"};try{localStorage.removeItem(KEY)}catch{}transient={selected:null,feedback:null,current:null,currentIsReview:false,selectedLeft:null,assignments:{},reviewTag:null,reviewTries:0,reviewList:[],toastTimer:null};render()}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

app.addEventListener("submit",e=>{if(e.target.id==="startForm"){e.preventDefault();start()}});
app.addEventListener("input",e=>{if(e.target.id==="studentName"){const b=document.querySelector('#startForm button[type="submit"]');if(b)b.disabled=e.target.value.trim().length<2}});
app.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="unlock-lesson"){transient.lessonUnlocked=true;render();return}if(a==="retry-answer"){transient.feedback=null;transient.selected=null;transient.selectedLeft=null;if(transient.current&&transient.current.type==="match")transient.assignments={};render();return}
 if(a==="resume"){render();return} if(a==="reset"){if(confirm("Começar uma campanha nova? O progresso salvo neste navegador será apagado."))makeNewCampaign();return}
 if(a==="lesson-choice"){if(transient.feedback)return;transient.selected=Number(b.dataset.index);render();return}
 if(a==="submit-lesson"){submitLesson();return} if(a==="next-lesson"){nextLesson();return} if(a==="prev-lesson"){if(state.lessonIndex>0){state.lessonIndex--;transient.selected=null;transient.feedback=null;transient.lessonUnlocked=false;persist();render()}return}
 if(a==="exercise-choice"){if(transient.feedback)return;transient.selected=Number(b.dataset.index);render();return}
 if(a==="match-left"){if(transient.feedback)return;transient.selectedLeft=Number(b.dataset.index);render();return}
 if(a==="match-right"){if(transient.feedback||transient.selectedLeft===null)return;transient.assignments[transient.selectedLeft]=Number(b.dataset.index);transient.selectedLeft=null;render();return}
 if(a==="submit-exercise"){submitPractice();return} if(a==="next-question"){nextPractice();return}
 if(a==="submit-boss"){submitBoss();return}if(a==="next-boss"){nextBoss();return}
 if(a==="submit-review"){submitReview();return}if(a==="next-review"){nextReview();return}if(a==="defer-review"){const tag=transient.reviewTag;if(tag)clearMissed(tag);transient.selected=null;transient.feedback=null;transient.reviewTag=null;if(!state.missed.length)state.stage="finish";persist();render();return}
 if(a==="restart-review"){state.stage="review";transient.selected=null;transient.feedback=null;persist();render();return}if(a==="restart-campaign"){if(confirm("Iniciar nova campanha do zero?"))makeNewCampaign();return}
});

setInterval(()=>{if(state.startedAt&&state.stage!=="welcome"){const el=document.getElementById("timer");if(el)el.textContent=fmtTime(getElapsed());const t=document.getElementById("thinkTimer");if(t&&state.paceStartedAt){const left=Math.max(0,state.paceSeconds-Math.floor((Date.now()-state.paceStartedAt)/1000));t.textContent=fmtTime(left);if(left===0&&!state.paceReleased){state.paceReleased=true;render()}}}},1000);
render();
})();
</script>
